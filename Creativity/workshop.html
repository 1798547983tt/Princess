<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <span class="dragon-eye"></span>
        <span class="title">龙族·创意工坊</span>
      </div>
      <div class="header-actions">
        <button class="btn" id="refreshBtn">刷新</button>
        <a class="btn" href="https://github.com/1798547983tt/Princess/tree/main/Creativity/mods" target="_blank">投稿 Mod</a>
      </div>
    </div>

    <div class="search-bar">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索 Mod 名称、描述、作者或标签..." />
    </div>

    <div class="categories" id="categories"></div>

    <div class="mod-grid" id="modGrid">
      <div class="loading"><div class="spinner"></div>加载中...</div>
    </div>

    <div class="footer">
      <span>数据来源: <a href="https://github.com/1798547983tt/Princess/tree/main/Creativity/mods" target="_blank">GitHub 仓库</a></span>
      <span id="modCount"></span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-box" id="detailBox"></div>
  </div>

  <script>
  (function () {
    'use strict';

    var GITHUB_OWNER = '1798547983tt';
    var GITHUB_REPO = 'Princess';
    var GITHUB_MODS_PATH = 'Creativity/mods';
    var GITHUB_API = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + GITHUB_MODS_PATH;
    var CATEGORIES = ['全部', '角色', '世界观', '势力', '拓展'];
    var CACHE_KEY = 'dragon_workshop_mods';
    var CACHE_TS_KEY = 'dragon_workshop_mods_ts';
    var CACHE_TTL = 5 * 60 * 1000;

    var BRIDGE_CHANNEL = 'creative-workshop:worldbook';
    var AUTH_CHANNEL = 'creative-workshop:auth';

    var allMods = [];
    var currentCategory = '全部';
    var currentSearch = '';
    var bridgeAvailable = false;
    var installedMods = {}; // { modId: true }
    var _requestId = 0;
    var _pending = {};

    // ─── 工具 ─────────────────────────────────────────
    function escHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str || ''));
      return div.innerHTML;
    }

    function showToast(msg, type) {
      var toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + (type || 'info') + ' show';
      setTimeout(function () { toast.className = 'toast'; }, 2500);
    }

    // ─── 桥接通信 ─────────────────────────────────────
    function bridgeSend(action, payload) {
      return new Promise(function (resolve, reject) {
        var id = 'req_' + (++_requestId);
        var timeout = setTimeout(function () {
          delete _pending[id];
          reject(new Error('桥接请求超时: ' + action));
        }, 15000);
        _pending[id] = { resolve: resolve, reject: reject, timeout: timeout };
        window.parent.postMessage({
          channel: BRIDGE_CHANNEL,
          kind: 'request',
          id: id,
          action: action,
          payload: payload || {}
        }, '*');
      });
    }

    function initBridge() {
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data) return;

        // 处理桥接响应
        if (data.channel === BRIDGE_CHANNEL && data.kind === 'response') {
          var pending = _pending[data.id];
          if (!pending) return;
          clearTimeout(pending.timeout);
          delete _pending[data.id];
          if (data.ok) pending.resolve(data.payload);
          else pending.reject(new Error(data.error || '桥接请求失败'));
        }
      });

      // 发送握手
      bridgeSend('handshake').then(function (result) {
        bridgeAvailable = true;
        console.log('[创意工坊] 桥接已连接:', result.label);
        showToast('已连接酒馆', 'success');
      }).catch(function () {
        bridgeAvailable = false;
        console.log('[创意工坊] 桥接不可用，仅展示模式');
      });
    }

    // ─── 安装/卸载 ───────────────────────────────────
    function buildEntryForInstall(mod, entry) {
      return {
        name: entry.name || '',
        content: entry.content || '',
        enabled: entry.enabled !== false,
        position: entry.position || { type: 'after_character_definition', role: 'system', depth: 0 },
        disable: false,
        key: entry.key || [],
        selective: entry.selective || false,
        strategy: entry.strategy || { type: 'constant', keys: [], keys_secondary: { logic: 'and_any', keys: [] }, scan_depth: 'same_as_global' },
        recursion: entry.recursion || { prevent_incoming: false, prevent_outgoing: false, delay_until: null },
        effect: entry.effect || { sticky: null, cooldown: null, delay: null },
        probability: entry.probability != null ? entry.probability : 100,
        extra: {
          creativeWorkshop: {
            sourceId: mod.id,
            sourceType: 'workshop',
            sourceTitle: mod.name,
            sourceUpdatedAt: mod.updated_at || new Date().toISOString(),
            installedAt: new Date().toISOString(),
            slot: 'managed'
          }
        }
      };
    }

    function installMod(mod) {
      if (!bridgeAvailable) {
        showToast('未连接酒馆，无法安装', 'error');
        return Promise.reject(new Error('桥接不可用'));
      }

      var entries = mod.entries.map(function (e) { return buildEntryForInstall(mod, e); });
      return bridgeSend('upsertWorkshopEntries', {
        entries: entries,
        sourceMeta: { sourceId: mod.id, sourceType: 'workshop' }
      }).then(function () {
        installedMods[mod.id] = true;
        saveInstalledState();
        showToast('已安装: ' + mod.name, 'success');
        renderMods();
      }).catch(function (err) {
        showToast('安装失败: ' + err.message, 'error');
        throw err;
      });
    }

    function uninstallMod(mod) {
      if (!bridgeAvailable) {
        showToast('未连接酒馆，无法卸载', 'error');
        return Promise.reject(new Error('桥接不可用'));
      }

      // 先获取所有条目，找到属于该 Mod 的
      return bridgeSend('getEntries').then(function (result) {
        var entries = result.entries || [];
        var uids = [];
        for (var i = 0; i < entries.length; i++) {
          var meta = entries[i] && entries[i].extra && entries[i].extra.creativeWorkshop;
          if (meta && meta.sourceId === mod.id && meta.sourceType === 'workshop') {
            uids.push(entries[i].uid);
          }
        }
        if (uids.length === 0) {
          showToast('未找到已安装的条目', 'info');
          return;
        }
        return bridgeSend('deleteEntries', { uids: uids });
      }).then(function () {
        delete installedMods[mod.id];
        saveInstalledState();
        showToast('已卸载: ' + mod.name, 'success');
        renderMods();
      }).catch(function (err) {
        showToast('卸载失败: ' + err.message, 'error');
        throw err;
      });
    }

    function saveInstalledState() {
      try { localStorage.setItem('dragon_workshop_installed', JSON.stringify(installedMods)); } catch (e) {}
    }

    function loadInstalledState() {
      try {
        var raw = localStorage.getItem('dragon_workshop_installed');
        if (raw) installedMods = JSON.parse(raw);
      } catch (e) {}
    }

    // ─── GitHub API ───────────────────────────────────
    function fetchJson(url) {
      return fetch(url, { headers: { 'Accept': 'application/vnd.github.v3+json' } })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        });
    }

    function loadMods() {
      var grid = document.getElementById('modGrid');
      grid.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';

      try {
        var cached = localStorage.getItem(CACHE_KEY);
        var cachedTs = localStorage.getItem(CACHE_TS_KEY);
        if (cached && cachedTs && Date.now() - parseInt(cachedTs, 10) < CACHE_TTL) {
          allMods = JSON.parse(cached);
          renderMods();
          return;
        }
      } catch (e) {}

      fetchJson(GITHUB_API).then(function (files) {
        var jsonFiles = files.filter(function (f) { return f.type === 'file' && /\.json$/i.test(f.name); });
        return Promise.all(jsonFiles.map(function (f) {
          return fetchJson(f.download_url).catch(function () { return null; });
        }));
      }).then(function (results) {
        allMods = results.filter(function (m) { return m && m.id && m.name && Array.isArray(m.entries); });
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify(allMods));
          localStorage.setItem(CACHE_TS_KEY, String(Date.now()));
        } catch (e) {}
        renderMods();
      }).catch(function (err) {
        grid.innerHTML = '<div class="error-state">加载失败: ' + escHtml(err.message) + '</div>';
      });
    }

    // ─── 渲染 ─────────────────────────────────────────
    function renderCategories() {
      var container = document.getElementById('categories');
      container.innerHTML = CATEGORIES.map(function (c) {
        return '<button class="cat-btn ' + (c === currentCategory ? 'active' : '') + '" data-cat="' + c + '">' + c + '</button>';
      }).join('');

      var btns = container.querySelectorAll('.cat-btn');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () {
          for (var j = 0; j < btns.length; j++) btns[j].classList.remove('active');
          this.classList.add('active');
          currentCategory = this.getAttribute('data-cat');
          renderMods();
        });
      }
    }

    function renderMods() {
      var grid = document.getElementById('modGrid');

      var filtered = allMods.filter(function (m) {
        var catMatch = currentCategory === '全部' || m.category === currentCategory;
        var searchMatch = !currentSearch ||
          m.name.toLowerCase().indexOf(currentSearch) !== -1 ||
          (m.description || '').toLowerCase().indexOf(currentSearch) !== -1 ||
          (m.author || '').toLowerCase().indexOf(currentSearch) !== -1 ||
          (m.tags || []).some(function (t) { return t.toLowerCase().indexOf(currentSearch) !== -1; });
        return catMatch && searchMatch;
      });

      document.getElementById('modCount').textContent = filtered.length + ' 个 Mod' + (bridgeAvailable ? ' · 已连接酒馆' : ' · 仅展示');

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty">未找到 Mod<span style="font-size:12px;">试试其他分类或关键词</span></div>';
        return;
      }

      grid.innerHTML = filtered.map(function (mod, index) {
        var installed = !!installedMods[mod.id];
        var tagsHtml = (mod.tags || []).slice(0, 4).map(function (t) {
          return '<span class="tag">' + escHtml(t) + '</span>';
        }).join('');

        return (
          '<div class="mod-card" data-mod-id="' + escHtml(mod.id) + '" style="animation-delay:' + (index * 50) + 'ms">' +
          '  <div class="card-header">' +
          '    <span class="card-name">🧩 ' + escHtml(mod.name) + '</span>' +
          '    <span class="card-version">v' + escHtml(mod.version || '1.0') + '</span>' +
          '  </div>' +
          '  <span class="card-category">' + escHtml(mod.category || '未分类') + '</span>' +
          '  <div class="card-author">作者: ' + escHtml(mod.author || '未知') + '</div>' +
          '  <div class="card-desc">' + escHtml(mod.description || '') + '</div>' +
          '  <div class="card-footer">' +
          '    <div class="card-tags">' + tagsHtml + '</div>' +
          '    <button class="install-btn ' + (installed ? 'installed' : '') + '" data-mod-id="' + escHtml(mod.id) + '">' +
               (installed ? '已安装 ✓' : '安装') +
          '    </button>' +
          '  </div>' +
          '</div>'
        );
      }).join('');

      requestAnimationFrame(function () {
        var cards = grid.querySelectorAll('.mod-card');
        for (var i = 0; i < cards.length; i++) {
          (function (card, idx) {
            setTimeout(function () { card.classList.add('card-visible'); }, idx * 50);
          })(cards[i], i);
        }
      });

      // 安装/卸载按钮
      var btns = grid.querySelectorAll('.install-btn');
      for (var b = 0; b < btns.length; b++) {
        btns[b].addEventListener('click', function (e) {
          e.stopPropagation();
          var modId = this.getAttribute('data-mod-id');
          var mod = allMods.find(function (m) { return m.id === modId; });
          if (!mod) return;
          var btn = this;
          if (installedMods[modId]) {
            uninstallMod(mod);
          } else {
            btn.textContent = '安装中...';
            btn.disabled = true;
            installMod(mod).catch(function () {
              btn.textContent = '安装';
              btn.disabled = false;
            });
          }
        });
      }

      // 点击卡片显示详情
      var cards = grid.querySelectorAll('.mod-card');
      for (var c = 0; c < cards.length; c++) {
        cards[c].addEventListener('click', function () {
          var modId = this.getAttribute('data-mod-id');
          var mod = allMods.find(function (m) { return m.id === modId; });
          if (mod) showDetail(mod);
        });
      }
    }

    function showDetail(mod) {
      var overlay = document.getElementById('detailOverlay');
      var box = document.getElementById('detailBox');
      var installed = !!installedMods[mod.id];

      var entriesHtml = (mod.entries || []).map(function (e) {
        return (
          '<div class="detail-entry">' +
          '  <div class="detail-entry-name">' + escHtml(e.name || '未命名条目') + '</div>' +
          '  <div class="detail-entry-content">' + escHtml(e.content || '（无内容）') + '</div>' +
          '</div>'
        );
      }).join('');

      box.innerHTML =
        '<div class="detail-title">🧩 ' + escHtml(mod.name) + '</div>' +
        '<div class="detail-meta">' +
        '  作者: ' + escHtml(mod.author || '未知') + ' · ' +
        '  版本: v' + escHtml(mod.version || '1.0') + ' · ' +
        '  分类: ' + escHtml(mod.category || '未分类') + ' · ' +
        '  更新: ' + escHtml((mod.updated_at || '').substring(0, 10)) +
        '</div>' +
        '<div class="detail-desc">' + escHtml(mod.description || '') + '</div>' +
        '<div class="detail-entries-title">世界书条目 (' + (mod.entries || []).length + ')</div>' +
        entriesHtml +
        '<div class="detail-actions">' +
        '  <button class="detail-install ' + (installed ? 'installed' : '') + '" id="detailInstallBtn">' +
             (installed ? '已安装 ✓ — 点击卸载' : '安装此 Mod') +
        '  </button>' +
        '  <button class="detail-close" id="detailCloseBtn">关闭</button>' +
        '</div>';

      overlay.classList.add('visible');

      document.getElementById('detailCloseBtn').addEventListener('click', function () {
        overlay.classList.remove('visible');
      });

      document.getElementById('detailInstallBtn').addEventListener('click', function () {
        if (installedMods[mod.id]) {
          uninstallMod(mod).then(function () { overlay.classList.remove('visible'); });
        } else {
          installMod(mod).then(function () { overlay.classList.remove('visible'); });
        }
      });
    }

    // ─── 初始化 ───────────────────────────────────────
    loadInstalledState();
    renderCategories();
    loadMods();
    initBridge();

    document.getElementById('refreshBtn').addEventListener('click', function () {
      try {
        localStorage.removeItem(CACHE_KEY);
        localStorage.removeItem(CACHE_TS_KEY);
      } catch (e) {}
      loadMods();
    });

    var searchTimeout;
    document.getElementById('searchInput').addEventListener('input', function (e) {
      clearTimeout(searchTimeout);
      var self = this;
      searchTimeout = setTimeout(function () {
        currentSearch = self.value.trim().toLowerCase();
        renderMods();
      }, 200);
    });

    document.getElementById('detailOverlay').addEventListener('click', function (e) {
      if (e.target === this) this.classList.remove('visible');
    });
  })();
  </script>
</body>
</html>
