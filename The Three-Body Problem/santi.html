<!-- 三体状态栏 v1.1.0 | 三主题配色 | 只读 MVU 映射 | 2026-07-16 -->
<!doctype html>
<html lang="zh-CN" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="app-version" content="1.1.0">
  <title>黑暗森林观测终端</title>
  <style>
:root {
  color-scheme: dark;
  --void-rgb: 5, 10, 16;
  --abyss-rgb: 8, 16, 24;
  --surface-rgb: 14, 28, 38;
  --surface-hover-rgb: 18, 36, 47;
  --accent-rgb: 126, 193, 201;
  --muted-rgb: 116, 143, 149;
  --danger-rgb: 214, 88, 76;
  --amber-rgb: 198, 153, 82;
  --cyan-rgb: 84, 160, 171;
  --star-rgb: 205, 238, 241;
  --void: rgb(var(--void-rgb));
  --abyss: rgb(var(--abyss-rgb));
  --glass: rgba(var(--surface-rgb), 0.9);
  --glass-soft: rgba(var(--surface-rgb), 0.72);
  --line: rgba(var(--accent-rgb), 0.2);
  --line-strong: rgba(var(--accent-rgb), 0.42);
  --phosphor: #b2d2d6;
  --phosphor-hot: #eff9fa;
  --muted: #8da5aa;
  --dim: #657d82;
  --text-soft: #a4bdc1;
  --text-faint: #849da2;
  --red: #d6584c;
  --red-hot: #f08778;
  --amber: #c69952;
  --cyan: #62a7b2;
  --ink: #0a151d;
  --shadow-outer: rgba(0, 0, 0, 0.5);
  --shadow-inner: rgba(0, 0, 0, 0.34);
  --edge-highlight: rgba(226, 248, 250, 0.07);
  --scan-blend: screen;
  --font-scale: 1;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", STSong, Georgia, serif;
  --sans: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
}

:root[data-theme="day"] {
  color-scheme: light;
  --void-rgb: 244, 247, 245;
  --abyss-rgb: 255, 255, 255;
  --surface-rgb: 250, 252, 250;
  --surface-hover-rgb: 255, 255, 255;
  --accent-rgb: 54, 111, 118;
  --muted-rgb: 95, 119, 123;
  --danger-rgb: 176, 65, 56;
  --amber-rgb: 145, 101, 44;
  --cyan-rgb: 47, 116, 128;
  --star-rgb: 58, 104, 110;
  --line: rgba(var(--accent-rgb), 0.2);
  --line-strong: rgba(var(--accent-rgb), 0.38);
  --phosphor: #385459;
  --phosphor-hot: #182f34;
  --muted: #536d72;
  --dim: #75878a;
  --text-soft: #425c61;
  --text-faint: #60787c;
  --red: #b04138;
  --red-hot: #8f302a;
  --amber: #91652c;
  --cyan: #2f7480;
  --ink: #f4f7f5;
  --shadow-outer: rgba(37, 56, 59, 0.16);
  --shadow-inner: rgba(37, 56, 59, 0.08);
  --edge-highlight: rgba(255, 255, 255, 0.82);
  --scan-blend: multiply;
}

:root[data-theme="tea"] {
  color-scheme: light;
  --void-rgb: 232, 223, 204;
  --abyss-rgb: 247, 241, 228;
  --surface-rgb: 240, 231, 213;
  --surface-hover-rgb: 251, 246, 235;
  --accent-rgb: 119, 91, 57;
  --muted-rgb: 127, 108, 87;
  --danger-rgb: 151, 67, 57;
  --amber-rgb: 145, 99, 47;
  --cyan-rgb: 72, 113, 112;
  --star-rgb: 112, 86, 55;
  --line: rgba(var(--accent-rgb), 0.2);
  --line-strong: rgba(var(--accent-rgb), 0.4);
  --phosphor: #5c4c3e;
  --phosphor-hot: #2f2720;
  --muted: #756452;
  --dim: #92816f;
  --text-soft: #665546;
  --text-faint: #7f6d5d;
  --red: #974339;
  --red-hot: #7d332d;
  --amber: #91632f;
  --cyan: #487170;
  --ink: #f3ebdc;
  --shadow-outer: rgba(73, 54, 34, 0.18);
  --shadow-inner: rgba(73, 54, 34, 0.1);
  --edge-highlight: rgba(255, 252, 243, 0.78);
  --scan-blend: multiply;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  background: transparent;
  color: var(--phosphor);
  font-family: var(--sans);
  font-size: calc(14px * var(--font-scale));
}

button,
input {
  font: inherit;
}

button {
  color: inherit;
}

.tb-frame {
  position: relative;
  width: min(100%, 1120px);
  margin: 0 auto;
  overflow: hidden;
  isolation: isolate;
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  background:
    radial-gradient(circle at 84% 8%, rgba(var(--accent-rgb), 0.12), transparent 24%),
    radial-gradient(circle at 14% 74%, rgba(var(--danger-rgb), 0.09), transparent 28%),
    linear-gradient(145deg, rgba(var(--void-rgb), 0.98), rgba(var(--surface-rgb), 0.98) 52%, rgba(var(--void-rgb), 0.99));
  box-shadow:
    0 18px 60px var(--shadow-outer),
    inset 0 0 70px var(--shadow-inner),
    inset 0 1px 0 var(--edge-highlight);
}

.tb-frame::before,
.tb-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}

.tb-frame::before {
  opacity: 0.48;
  background-image:
    radial-gradient(circle at 6% 18%, rgba(var(--star-rgb), 0.75) 0 0.6px, transparent 0.9px),
    radial-gradient(circle at 18% 64%, rgba(var(--star-rgb), 0.5) 0 0.6px, transparent 1px),
    radial-gradient(circle at 41% 28%, rgba(var(--star-rgb), 0.45) 0 0.5px, transparent 0.9px),
    radial-gradient(circle at 69% 76%, rgba(var(--star-rgb), 0.55) 0 0.6px, transparent 1px),
    radial-gradient(circle at 88% 31%, rgba(var(--star-rgb), 0.7) 0 0.6px, transparent 1px),
    radial-gradient(circle at 97% 88%, rgba(var(--star-rgb), 0.42) 0 0.5px, transparent 0.9px);
  background-size: 173px 149px, 211px 191px, 257px 229px, 293px 271px, 337px 311px, 389px 347px;
}

.tb-frame::after {
  opacity: 0.16;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(var(--accent-rgb), 0.08) 4px);
  mix-blend-mode: var(--scan-blend);
}

.tb-scan {
  position: absolute;
  left: 0;
  right: 0;
  top: -30%;
  z-index: 20;
  height: 26%;
  pointer-events: none;
  opacity: 0.22;
  background: linear-gradient(180deg, transparent, rgba(var(--accent-rgb), 0.07), transparent);
  animation: tb-scan 9s linear infinite;
}

@keyframes tb-scan {
  to { transform: translateY(500%); }
}

.tb-header {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(250px, 0.65fr);
  gap: 22px;
  padding: 25px 28px 19px;
  border-bottom: 1px solid var(--line);
}

.tb-header::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: -1px;
  width: 34%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--red));
  box-shadow: 0 0 12px rgba(var(--danger-rgb), 0.44);
}

.tb-kicker,
.tb-eyebrow {
  color: var(--muted);
  font-family: var(--mono);
  font-size: calc(9px * var(--font-scale));
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

.tb-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
}

.tb-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--phosphor);
  box-shadow: 0 0 10px var(--phosphor);
  animation: tb-pulse 2.2s ease-in-out infinite;
}

@keyframes tb-pulse {
  50% { opacity: 0.28; transform: scale(0.78); }
}

.tb-title {
  margin: 0;
  color: var(--phosphor-hot);
  font-family: var(--serif);
  font-size: clamp(25px, 4vw, 43px);
  font-weight: 500;
  letter-spacing: 0.09em;
  line-height: 1.05;
  text-shadow: 0 0 28px rgba(var(--accent-rgb), 0.14);
}

.tb-subtitle {
  margin-top: 9px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(10px * var(--font-scale));
  letter-spacing: 0.16em;
}

.tb-coordinate {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 18px;
  align-items: center;
}

.tb-coordinate-text {
  min-width: 0;
  text-align: right;
}

.tb-time {
  color: var(--phosphor-hot);
  font-family: var(--mono);
  font-size: calc(15px * var(--font-scale));
  font-variant-numeric: tabular-nums;
  line-height: 1.35;
}

.tb-location {
  margin-top: 5px;
  overflow: hidden;
  color: var(--muted);
  font-size: calc(11px * var(--font-scale));
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tb-orbit {
  --p: 0;
  position: relative;
  display: grid;
  width: 74px;
  aspect-ratio: 1;
  place-items: center;
  border-radius: 50%;
  background: conic-gradient(var(--red) calc(var(--p) * 1%), rgba(var(--muted-rgb), 0.13) 0);
  box-shadow: 0 0 24px rgba(var(--danger-rgb), 0.12);
}

.tb-orbit::before {
  content: "";
  position: absolute;
  inset: 4px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--abyss);
}

.tb-orbit-value,
.tb-orbit-label {
  position: relative;
  z-index: 1;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.tb-orbit-value {
  margin-top: 7px;
  color: var(--red-hot);
  font-size: calc(17px * var(--font-scale));
}

.tb-orbit-label {
  margin-top: -17px;
  color: var(--dim);
  font-size: calc(7px * var(--font-scale));
  letter-spacing: 0.12em;
}

.tb-tabs {
  display: flex;
  gap: 0;
  padding: 0 17px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}

.tb-tabs::-webkit-scrollbar {
  display: none;
}

.tb-tab {
  position: relative;
  flex: 1 0 auto;
  min-width: 100px;
  padding: 14px 12px 12px;
  border: 0;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  font-family: var(--serif);
  font-size: calc(13px * var(--font-scale));
  letter-spacing: 0.08em;
  transition: color 180ms ease, background 180ms ease;
}

.tb-tab::before {
  content: attr(data-code);
  display: block;
  margin-bottom: 3px;
  font-family: var(--mono);
  font-size: calc(7px * var(--font-scale));
  letter-spacing: 0.18em;
}

.tb-tab::after {
  content: "";
  position: absolute;
  right: 20%;
  bottom: -1px;
  left: 20%;
  height: 1px;
  background: var(--phosphor);
  box-shadow: 0 0 10px var(--phosphor);
  opacity: 0;
  transform: scaleX(0.2);
  transition: opacity 180ms ease, transform 180ms ease;
}

.tb-tab:hover,
.tb-tab.active {
  color: var(--phosphor-hot);
  background: linear-gradient(180deg, transparent, rgba(var(--accent-rgb), 0.06));
}

.tb-tab.active::after {
  opacity: 1;
  transform: scaleX(1);
}

.tb-main {
  padding: 21px 22px 19px;
}

.tb-panel {
  display: none;
  animation: tb-in 260ms ease both;
}

.tb-panel.active {
  display: block;
}

@keyframes tb-in {
  from { opacity: 0; transform: translateY(4px); }
}

.tb-hero-grid,
.tb-grid-2,
.tb-grid-3,
.tb-entity-grid {
  display: grid;
  gap: 12px;
}

.tb-hero-grid {
  grid-template-columns: minmax(0, 1.08fr) minmax(270px, 0.92fr);
}

.tb-grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.tb-grid-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.tb-entity-grid {
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
}

.tb-card,
.tb-entity {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  background: linear-gradient(145deg, rgba(var(--surface-rgb), 0.72), rgba(var(--void-rgb), 0.68));
  box-shadow: inset 0 1px 0 rgba(var(--star-rgb), 0.04);
}

.tb-card::before,
.tb-entity::before {
  content: "";
  position: absolute;
  top: -1px;
  left: -1px;
  width: 31px;
  height: 9px;
  border-top: 1px solid var(--phosphor);
  border-left: 1px solid var(--phosphor);
  opacity: 0.55;
}

.tb-card {
  padding: 16px;
}

.tb-card[data-action="open-root"],
.tb-entity[data-action="open-entity"] {
  cursor: pointer;
}

.tb-card[data-action="open-root"]:hover,
.tb-entity:hover {
  border-color: var(--line-strong);
  background: linear-gradient(145deg, rgba(var(--surface-hover-rgb), 0.84), rgba(var(--abyss-rgb), 0.76));
}

.tb-card-title,
.tb-section-title,
.tb-entity-name {
  color: var(--phosphor-hot);
  font-family: var(--serif);
  font-weight: 500;
}

.tb-card-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  font-size: calc(15px * var(--font-scale));
  letter-spacing: 0.06em;
}

.tb-card-code,
.tb-count {
  flex: 0 0 auto;
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
  letter-spacing: 0.12em;
}

.tb-section-head {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  margin: 21px 1px 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}

.tb-section-title {
  font-size: calc(16px * var(--font-scale));
  letter-spacing: 0.08em;
}

.tb-section-meta {
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
  letter-spacing: 0.1em;
}

.tb-fact-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
  gap: 7px;
}

.tb-fact {
  padding: 8px 9px;
  border-left: 1px solid rgba(var(--accent-rgb), 0.22);
  background: rgba(var(--accent-rgb), 0.045);
}

.tb-fact-label {
  margin-bottom: 4px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
  letter-spacing: 0.08em;
}

.tb-fact-value {
  overflow-wrap: anywhere;
  color: var(--phosphor);
  font-size: calc(12px * var(--font-scale));
  line-height: 1.5;
}

.tb-summary {
  color: var(--text-soft);
  font-family: var(--serif);
  font-size: calc(13px * var(--font-scale));
  line-height: 1.8;
}

.tb-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tb-chip,
.tb-status {
  display: inline-flex;
  align-items: center;
  max-width: 100%;
  border: 1px solid rgba(var(--accent-rgb), 0.22);
  background: rgba(var(--accent-rgb), 0.07);
  color: var(--text-soft);
  font-family: var(--mono);
  font-size: calc(9px * var(--font-scale));
  line-height: 1.25;
  letter-spacing: 0.04em;
}

.tb-chip {
  padding: 4px 7px;
}

.tb-chip.danger,
.tb-status.danger {
  border-color: rgba(var(--danger-rgb), 0.36);
  background: rgba(var(--danger-rgb), 0.09);
  color: var(--red-hot);
}

.tb-chip.amber,
.tb-status.amber {
  border-color: rgba(var(--amber-rgb), 0.32);
  background: rgba(var(--amber-rgb), 0.08);
  color: var(--amber);
}

.tb-chip.cyan,
.tb-status.cyan {
  border-color: rgba(var(--cyan-rgb), 0.32);
  background: rgba(var(--cyan-rgb), 0.08);
  color: var(--cyan);
}

.tb-status {
  flex: 0 0 auto;
  padding: 3px 6px;
  white-space: nowrap;
}

.tb-bars {
  display: grid;
  gap: 10px;
}

.tb-bar-row {
  display: grid;
  gap: 5px;
}

.tb-bar-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: calc(9px * var(--font-scale));
  font-variant-numeric: tabular-nums;
}

.tb-bar {
  height: 3px;
  overflow: hidden;
  background: rgba(var(--muted-rgb), 0.14);
}

.tb-bar-fill {
  width: 0;
  height: 100%;
  background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.52), var(--phosphor));
  box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.42);
  transition: width 500ms ease;
}

.tb-bar-fill.warn {
  background: linear-gradient(90deg, rgba(var(--amber-rgb), 0.6), var(--amber));
  box-shadow: 0 0 8px rgba(var(--amber-rgb), 0.32);
}

.tb-bar-fill.danger {
  background: linear-gradient(90deg, rgba(var(--danger-rgb), 0.7), var(--red-hot));
  box-shadow: 0 0 8px rgba(var(--danger-rgb), 0.36);
}

.tb-radar-wrap {
  display: grid;
  grid-template-columns: minmax(180px, 0.85fr) minmax(150px, 1.15fr);
  align-items: center;
  gap: 8px;
}

.tb-radar {
  display: block;
  width: 100%;
  max-width: 230px;
  margin: 0 auto;
}

.tb-radar .grid {
  fill: none;
  stroke: rgba(var(--accent-rgb), 0.17);
  stroke-width: 1;
}

.tb-radar .axis {
  stroke: rgba(var(--accent-rgb), 0.13);
  stroke-width: 1;
}

.tb-radar .shape {
  fill: rgba(var(--danger-rgb), 0.13);
  stroke: var(--red-hot);
  stroke-width: 1.2;
  filter: drop-shadow(0 0 5px rgba(var(--danger-rgb), 0.35));
}

.tb-radar text {
  fill: var(--muted);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.06em;
}

.tb-alert-list,
.tb-plain-list {
  display: grid;
  gap: 7px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tb-alert-list li,
.tb-plain-list li {
  position: relative;
  padding-left: 14px;
  color: var(--text-faint);
  font-size: calc(11px * var(--font-scale));
  line-height: 1.55;
}

.tb-alert-list li::before,
.tb-plain-list li::before {
  content: "";
  position: absolute;
  top: 0.62em;
  left: 0;
  width: 5px;
  height: 1px;
  background: var(--red);
  box-shadow: 0 0 6px rgba(var(--danger-rgb), 0.52);
}

.tb-plain-list li::before {
  background: var(--phosphor);
  box-shadow: none;
}

.tb-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 13px;
}

.tb-search {
  min-width: 0;
  flex: 1 1 auto;
  padding: 9px 11px;
  border: 1px solid var(--line);
  border-radius: 0;
  outline: none;
  background: rgba(var(--abyss-rgb), 0.7);
  color: var(--phosphor);
  font-family: var(--mono);
  font-size: calc(10px * var(--font-scale));
}

.tb-search:focus {
  border-color: var(--line-strong);
  box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.08);
}

.tb-filter {
  flex: 0 0 auto;
  padding: 8px 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--mono);
  font-size: calc(9px * var(--font-scale));
}

.tb-filter.active,
.tb-filter:hover {
  border-color: var(--line-strong);
  background: rgba(var(--accent-rgb), 0.08);
  color: var(--phosphor-hot);
}

.tb-entity {
  min-width: 0;
  padding: 13px;
  transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
}

.tb-entity:hover {
  transform: translateY(-1px);
}

.tb-entity-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.tb-entity-name {
  min-width: 0;
  overflow: hidden;
  font-size: calc(14px * var(--font-scale));
  letter-spacing: 0.04em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tb-entity-id {
  margin-top: 3px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
}

.tb-entity-body {
  margin-top: 10px;
  color: var(--text-faint);
  font-size: calc(11px * var(--font-scale));
  line-height: 1.62;
}

.tb-entity-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 11px;
}

.tb-presence {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.tb-presence::before {
  content: "";
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
  box-shadow: 0 0 7px currentColor;
}

.tb-chain {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(176px, 1fr);
  gap: 26px;
  padding: 3px 2px 11px;
  overflow-x: auto;
  scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent;
}

.tb-chain-node {
  position: relative;
  padding: 13px;
  border: 1px solid var(--line);
  background: rgba(var(--abyss-rgb), 0.78);
  cursor: pointer;
}

.tb-chain-node:not(:last-child)::after {
  content: "";
  position: absolute;
  top: 50%;
  left: calc(100% + 1px);
  width: 26px;
  height: 1px;
  background: linear-gradient(90deg, var(--red), rgba(var(--danger-rgb), 0.12));
}

.tb-chain-node:not(:last-child)::before {
  content: "";
  position: absolute;
  z-index: 1;
  top: calc(50% - 2px);
  left: calc(100% + 21px);
  width: 4px;
  height: 4px;
  border-top: 1px solid var(--red);
  border-right: 1px solid var(--red);
  transform: rotate(45deg);
}

.tb-chain-type {
  color: var(--red-hot);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
  letter-spacing: 0.08em;
}

.tb-chain-title {
  margin-top: 6px;
  color: var(--phosphor-hot);
  font-family: var(--serif);
  font-size: calc(13px * var(--font-scale));
  line-height: 1.45;
}

.tb-chain-meta {
  margin-top: 8px;
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
}

.tb-empty,
.tb-loading {
  display: grid;
  padding: 34px 18px;
  place-items: center;
  border: 1px dashed var(--line);
  color: var(--dim);
  text-align: center;
  font-family: var(--mono);
  font-size: calc(10px * var(--font-scale));
  letter-spacing: 0.08em;
}

.tb-loading-mark {
  width: 34px;
  aspect-ratio: 1;
  margin-bottom: 11px;
  border: 1px solid var(--line);
  border-top-color: var(--phosphor);
  border-radius: 50%;
  animation: tb-spin 1.5s linear infinite;
}

@keyframes tb-spin {
  to { transform: rotate(360deg); }
}

.tb-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 22px;
  border-top: 1px solid var(--line);
  background: rgba(var(--abyss-rgb), 0.62);
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
  letter-spacing: 0.08em;
}

.tb-footer-left {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tb-footer-tools,
.tb-theme-switch {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
}

.tb-footer-tools {
  gap: 8px;
}

.tb-theme-switch {
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--line);
  background: rgba(var(--abyss-rgb), 0.42);
}

.tb-theme-option {
  display: grid;
  width: 25px;
  height: 21px;
  padding: 0;
  place-items: center;
  border: 0;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  font-family: var(--serif);
  font-size: calc(10px * var(--font-scale));
  line-height: 1;
}

.tb-theme-option:hover {
  color: var(--phosphor-hot);
}

.tb-theme-option.active {
  background: rgba(var(--accent-rgb), 0.12);
  color: var(--phosphor-hot);
  box-shadow: inset 0 -1px 0 var(--phosphor);
}

.tb-refresh {
  flex: 0 0 auto;
  padding: 4px 7px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--mono);
  font-size: calc(8px * var(--font-scale));
}

.tb-refresh:hover {
  border-color: var(--line-strong);
  color: var(--phosphor-hot);
}

.tb-modal {
  position: absolute;
  inset: 0;
  z-index: 300;
  display: none;
  flex-direction: column;
  background:
    radial-gradient(circle at 80% 10%, rgba(var(--accent-rgb), 0.12), transparent 28%),
    rgba(var(--void-rgb), 0.985);
}

.tb-modal.active {
  display: flex;
}

.tb-modal-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--line);
}

.tb-modal-title {
  margin: 3px 0 0;
  color: var(--phosphor-hot);
  font-family: var(--serif);
  font-size: calc(22px * var(--font-scale));
  font-weight: 500;
  letter-spacing: 0.07em;
}

.tb-modal-close {
  flex: 0 0 auto;
  width: 34px;
  aspect-ratio: 1;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--mono);
}

.tb-modal-close:hover {
  border-color: rgba(var(--danger-rgb), 0.42);
  color: var(--red-hot);
}

.tb-modal-body {
  flex: 1 1 auto;
  max-height: 720px;
  padding: 18px 22px 28px;
  overflow-y: auto;
  scrollbar-color: rgba(var(--accent-rgb), 0.28) transparent;
}

.tb-detail-group {
  margin-bottom: 11px;
  border: 1px solid var(--line);
  background: rgba(var(--surface-rgb), 0.5);
}

.tb-detail-group > summary {
  padding: 11px 13px;
  color: var(--phosphor-hot);
  cursor: pointer;
  font-family: var(--serif);
  font-size: calc(13px * var(--font-scale));
  letter-spacing: 0.05em;
}

.tb-detail-content {
  padding: 0 13px 13px;
}

.tb-detail-row {
  display: grid;
  grid-template-columns: minmax(92px, 0.3fr) minmax(0, 0.7fr);
  gap: 13px;
  padding: 8px 0;
  border-bottom: 1px solid rgba(var(--accent-rgb), 0.1);
}

.tb-detail-row:last-child {
  border-bottom: 0;
}

.tb-detail-key {
  color: var(--dim);
  font-family: var(--mono);
  font-size: calc(9px * var(--font-scale));
}

.tb-detail-value {
  min-width: 0;
  overflow-wrap: anywhere;
  color: var(--text-soft);
  font-size: calc(11px * var(--font-scale));
  line-height: 1.65;
}

.tb-relation-strip {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  padding: 11px;
  border: 1px solid var(--line);
  background: rgba(var(--surface-rgb), 0.48);
}

.tb-relation-side {
  min-width: 0;
}

.tb-relation-side:last-child {
  text-align: right;
}

.tb-relation-arrow {
  color: var(--red);
  font-family: var(--mono);
}

.tb-error {
  border-color: rgba(var(--danger-rgb), 0.36);
  color: var(--red-hot);
}

@media (max-width: 760px) {
  .tb-header {
    grid-template-columns: 1fr;
    gap: 16px;
    padding: 21px 18px 16px;
  }

  .tb-coordinate {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .tb-coordinate-text {
    text-align: left;
  }

  .tb-orbit {
    width: 62px;
  }

  .tb-main {
    padding: 16px 14px;
  }

  .tb-hero-grid,
  .tb-grid-2,
  .tb-grid-3 {
    grid-template-columns: 1fr;
  }

  .tb-tab {
    min-width: 90px;
  }

  .tb-radar-wrap {
    grid-template-columns: minmax(150px, 0.8fr) minmax(130px, 1.2fr);
  }

  .tb-footer {
    padding: 9px 14px;
  }

  .tb-footer-tools {
    gap: 6px;
  }
}

@media (max-width: 520px) {
  html,
  body {
    font-size: calc(13px * var(--font-scale));
  }

  .tb-title {
    font-size: 27px;
  }

  .tb-subtitle {
    letter-spacing: 0.08em;
  }

  .tb-toolbar {
    flex-wrap: wrap;
  }

  .tb-search {
    flex-basis: 100%;
  }

  .tb-radar-wrap {
    grid-template-columns: 1fr;
  }

  .tb-radar {
    max-width: 200px;
  }

  .tb-entity-grid {
    grid-template-columns: 1fr;
  }

  .tb-modal-head,
  .tb-modal-body {
    padding-right: 14px;
    padding-left: 14px;
  }

  .tb-detail-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }

  .tb-relation-strip {
    grid-template-columns: 1fr;
  }

  .tb-relation-side:last-child {
    text-align: left;
  }

  .tb-relation-arrow {
    transform: rotate(90deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

<body>
  <div class="tb-frame" id="tb-frame">
    <div class="tb-scan"></div>
    <header class="tb-header">
      <div>
        <div class="tb-kicker"><span class="tb-live-dot"></span><span id="tb-source">MVU SIGNAL · ACQUIRING</span></div>
        <h1 class="tb-title">黑暗森林观测终端</h1>
        <div class="tb-subtitle">RED COAST DEEP-SPACE ARRAY / TRISOLARIS OBSERVATORY</div>
      </div>
      <div class="tb-coordinate">
        <div class="tb-coordinate-text">
          <div class="tb-time" id="tb-time">时间未知</div>
          <div class="tb-location" id="tb-location">坐标尚未锁定</div>

        <div class="tb-orbit" id="tb-orbit" style="--p:0">
          <span class="tb-orbit-value" id="tb-deviation">—</span>

    <nav class="tb-tabs" aria-label="状态栏栏目">

      <button class="tb-tab" type="button" data-tab="protagonist" data-code="02 / SUBJECT">主角</button>
      <button class="tb-tab" type="button" data-tab="people" data-code="03 / PERSONAE">人物</button>
      <button class="tb-tab" type="button" data-tab="civilization" data-code="04 / DOMAIN">文明态势</button>
      <button class="tb-tab" type="button" data-tab="causality" data-code="05 / CASCADE">因果链</button>

    <main class="tb-main">
      <section class="tb-panel active" id="tb-panel-observation"><div class="tb-loading"><div class="tb-loading-mark"></div>正在搜索变量信号</div></section>
      <section class="tb-panel" id="tb-panel-protagonist"></section>
      <section class="tb-panel" id="tb-panel-people"></section>
      <section class="tb-panel" id="tb-panel-civilization"></section>
      <section class="tb-panel" id="tb-panel-causality"></section>
      <section class="tb-panel" id="tb-panel-records"></section>
    </main>

    <footer class="tb-footer">
      <div class="tb-footer-left" id="tb-footer-status">等待 MVU 初始化</div>
      <div class="tb-footer-tools">
        <div class="tb-theme-switch" role="group" aria-label="终端配色">
          <button class="tb-theme-option active" type="button" data-action="set-theme" data-theme-choice="night" aria-label="夜间模式" aria-pressed="true" title="夜间模式">夜</button>
          <button class="tb-theme-option" type="button" data-action="set-theme" data-theme-choice="day" aria-label="白昼模式" aria-pressed="false" title="白昼模式">昼</button>
          <button class="tb-theme-option" type="button" data-action="set-theme" data-theme-choice="tea" aria-label="茶色模式" aria-pressed="false" title="茶色模式">茶</button>
        </div>
        <button class="tb-refresh" type="button" data-action="refresh">重新采样</button>
      </div>

    <div class="tb-modal" id="tb-modal" aria-hidden="true">
      <div class="tb-modal-head">
        <div>
          <div class="tb-eyebrow" id="tb-modal-code">ARCHIVE DETAIL</div>
          <h2 class="tb-modal-title" id="tb-modal-title">档案详情</h2>
        </div>
        <button class="tb-modal-close" type="button" data-action="close-modal" aria-label="关闭">×</button>
      </div>
      <div class="tb-modal-body" id="tb-modal-body"></div>
    </div>

  <script>
window.ThreeBodyStatusbar = (() => {
  const state = {
    data: {},
    tab: "observation",
    npcFilter: "全部",
    npcSearch: "",
    domainFilter: "全部",
    refreshing: false,
    uidMap: new Map(),
    entityIndex: new Map(),
    preview: false,
    cleanup: [],
    timers: [],
  };

  const DICTIONARIES = [
    "人物", "关系", "组织", "文明", "科技", "项目", "重要资产", "情报", "通讯", "原著事件", "任务", "承诺", "记忆摘要",
  ];

  const $id = id => document.getElementById(id);

  const esc = value => String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");

  const asObject = value => value && typeof value === "object" && !Array.isArray(value) ? value : {};
  const asArray = value => Array.isArray(value) ? value : value == null || value === "" ? [] : [value];
  const entries = value => Object.entries(asObject(value));
  const valueAt = (source, path, fallback = "") => {
    const result = String(path).split(".").reduce((current, key) => current == null ? undefined : current[key], source);
    return result === undefined || result === null || result === "" ? fallback : result;
  };

  const isBlank = value => {
    if (value === undefined || value === null || value === "") return true;
    if (Array.isArray(value)) return value.length === 0;
    if (typeof value === "object") return Object.keys(value).length === 0;
    return false;
  };

  const numeric = value => {
    if (value === null || value === undefined || value === "") return null;
    const number = Number(value);
    return Number.isFinite(number) ? Math.max(0, Math.min(100, number)) : null;
  };

  const compact = (value, limit = 82) => {
    const text = safeDisplay(value);
    return text.length > limit ? `${text.slice(0, limit - 1)}…` : text;
  };

  const safeDisplay = (value, depth = 0) => {
    if (value === null || value === undefined || value === "") return "未记录";
    if (typeof value === "string" || typeof value === "number" || typeof value === "boolean") return String(value);
    if (depth >= 3) return "复杂记录";
    if (Array.isArray(value)) return value.length ? value.map(item => safeDisplay(item, depth + 1)).join("、") : "无";
    const object = asObject(value);
    const named = object.名称 || object.姓名 || object.标题 || object.摘要 || object.描述;
    if (named) return safeDisplay(named, depth + 1);
    const pairs = Object.entries(object).slice(0, 5).map(([key, item]) => `${key}: ${safeDisplay(item, depth + 1)}`);
    return pairs.length ? pairs.join("；") : "无";
  };

  const tone = value => {
    const text = String(value ?? "");
    if (/死亡|濒死|敌对|失败|失效|销毁|取消|绝密|不可逆|重大|全新|高风险|被截获|已违背/.test(text)) return "danger";
    if (/受阻|等待|延迟|潜伏|未知|受限|失踪|暂停|准备|待验证|可能/.test(text)) return "amber";
    if (/远程|传输|科技|实验|原型|进行中|已接收|高概率/.test(text)) return "cyan";
    return "";
  };

  const status = value => `<span class="tb-status ${tone(value)}" title="${esc(safeDisplay(value))}">${esc(compact(value, 12))}</span>`;
  const chip = (value, kind = "") => `<span class="tb-chip ${kind || tone(value)}" title="${esc(safeDisplay(value))}">${esc(compact(value, 16))}</span>`;
  const chips = (values, emptyText = "无记录") => {
    const list = asArray(values).filter(item => !isBlank(item));
    return list.length ? `<div class="tb-chips">${list.map(item => chip(item)).join("")}</div>` : `<span class="tb-count">${esc(emptyText)}</span>`;
  };

  const list = (values, alert = false, emptyText = "暂无记录") => {
    const rows = asArray(values).filter(item => !isBlank(item));
    if (!rows.length) return empty(emptyText);
    return `<ul class="${alert ? "tb-alert-list" : "tb-plain-list"}">${rows.map(item => `<li>${esc(resolveUIDs(safeDisplay(item)))}</li>`).join("")}</ul>`;
  };

  const empty = message => `<div class="tb-empty">${esc(message)}</div>`;
  const sectionHead = (title, meta = "") => `<div class="tb-section-head"><div class="tb-section-title">${esc(title)}</div><div class="tb-section-meta">${esc(meta)}</div></div>`;
  const cardTitle = (title, code = "") => `<div class="tb-card-title"><span>${esc(title)}</span><span class="tb-card-code">${esc(code)}</span></div>`;
  const fact = (label, value) => `<div class="tb-fact"><div class="tb-fact-label">${esc(label)}</div><div class="tb-fact-value">${esc(resolveUIDs(safeDisplay(value)))}</div></div>`;
  const factGrid = rows => `<div class="tb-fact-grid">${rows.filter(([, value]) => !isBlank(value)).map(([label, value]) => fact(label, value)).join("") || fact("记录", "未建立")}</div>`;

  const bar = (label, value, invert = false) => {
    const number = numeric(value);
    const shown = number === null ? "—" : `${Math.round(number)}%`;
    const danger = number !== null && (invert ? number < 35 : number >= 70);
    const warn = number !== null && !danger && (invert ? number < 60 : number >= 40);
    return `<div class="tb-bar-row"><div class="tb-bar-head"><span>${esc(label)}</span><span>${shown}</span></div><div class="tb-bar"><div class="tb-bar-fill ${danger ? "danger" : warn ? "warn" : ""}" style="width:${number ?? 0}%"></div></div></div>`;
  };

  const locationText = location => {
    const object = asObject(location);
    const order = ["星系", "天体", "国家或政体", "区域", "设施或载体", "具体地点"];
    const values = order.map(key => object[key]).filter(value => !isBlank(value));
    return values.length ? values.join(" · ") : "坐标尚未锁定";
  };

  const relationRefs = relation => [valueAt(relation, "A.UID", ""), valueAt(relation, "B.UID", "")].filter(Boolean);

  const rebuildIndexes = data => {
    state.uidMap.clear();
    state.entityIndex.clear();
    const protagonistName = valueAt(data, "主角.身份.姓名", "主角");
    state.uidMap.set("主角", protagonistName);
    state.entityIndex.set("ROOT:主角", { kind: "主角", uid: "主角", value: asObject(data.主角) });
    state.entityIndex.set("ROOT:世界线", { kind: "世界线", uid: "世界线", value: asObject(data.世界线) });
    state.entityIndex.set("ROOT:时空", { kind: "时空", uid: "时空", value: asObject(data.时空) });
    state.entityIndex.set("ROOT:场景", { kind: "场景", uid: "场景", value: asObject(data.场景) });

    DICTIONARIES.forEach(kind => {
      entries(data[kind]).forEach(([uid, value]) => {
        const object = asObject(value);
        const name = object.名称 || object.姓名 || object.标题 || object.内容 || uid;
        state.uidMap.set(uid, String(name));
        state.entityIndex.set(`${kind}:${uid}`, { kind, uid, value: object });
      });
    });

    entries(valueAt(data, "因果.节点", {})).forEach(([uid, value]) => {
      const object = asObject(value);
      state.uidMap.set(uid, object.标题 || uid);
      state.entityIndex.set(`因果节点:${uid}`, { kind: "因果节点", uid, value: object });
    });
    entries(valueAt(data, "因果.边", {})).forEach(([uid, value]) => state.entityIndex.set(`因果边:${uid}`, { kind: "因果边", uid, value: asObject(value) }));
    entries(valueAt(data, "因果.延迟效应", {})).forEach(([uid, value]) => {
      const object = asObject(value);
      state.uidMap.set(uid, object.名称 || uid);
      state.entityIndex.set(`延迟效应:${uid}`, { kind: "延迟效应", uid, value: object });
    });
    entries(valueAt(data, "因果.未来影响", {})).forEach(([uid, value]) => {
      const object = asObject(value);
      state.uidMap.set(uid, object.名称 || uid);
      state.entityIndex.set(`未来影响:${uid}`, { kind: "未来影响", uid, value: object });
    });
  };

  const resolveUID = uid => state.uidMap.get(String(uid)) || String(uid || "未知对象");
  const resolveUIDs = text => {
    let result = String(text ?? "");
    const matches = result.match(/(?:person|relation|org|civ|tech|project|asset|intel|comm|event|cause|edge|delay|projection|task|promise|memory)_\d+/g) || [];
    [...new Set(matches)].forEach(uid => {
      const name = state.uidMap.get(uid);
      if (name) result = result.replaceAll(uid, `${name}（${uid}）`);
    });
    return result;
  };

  const refText = value => {
    if (typeof value === "string") return resolveUID(value);
    const object = asObject(value);
    return object.名称 || resolveUID(object.UID) || "未知对象";
  };

  const normalizeData = raw => {
    const possibilities = [
      raw?.stat_data,
      raw?.data?.stat_data,
      raw?.variables?.stat_data,
      raw?.message?.data?.stat_data,
      raw?.data,
      raw,
    ];
    return possibilities.find(candidate => candidate && typeof candidate === "object" && (candidate.时空 || candidate.主角 || candidate.因果)) || null;
  };

  const withTimeout = (promise, milliseconds) => Promise.race([
    Promise.resolve(promise),
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), milliseconds)),
  ]);

  const readGameData = async () => {
    if (new URLSearchParams(location.search).get("preview") === "1") {
      state.preview = true;
      return typeof state.makePreviewData === "function" ? state.makePreviewData() : {};
    }

    state.preview = false;
    if (typeof globalThis.waitGlobalInitialized === "function") {
      try { await withTimeout(globalThis.waitGlobalInitialized("Mvu"), 2600); } catch {}
    }

    const ids = [];
    if (typeof globalThis.getCurrentMessageId === "function") {
      try {
        const current = globalThis.getCurrentMessageId();
        if (current !== undefined && current !== null) ids.push(current);

    }

        try {

  const renderCivilization = data => {
    const source = [

    const filters = ["全部", ...source.map(([kind]) => kind)];

    const activeProjects = entries(data.项目).filter(([, item]) => ["筹备", "进行中", "受阻", "暂停"].includes(item.状态));
    const exposedTech = entries(data.科技).filter(([, item]) => (numeric(item.扩散度) ?? 0) >= 60);

    const summary = `<div class="tb-grid-3">
      <article class="tb-card">${cardTitle("文明威胁峰值", "THREAT INDEX")}${civThreat ? `<div class="tb-summary">${esc(civThreat[1].名称 || civThreat[0])}</div><div style="margin-top:12px">${bar("威胁度", civThreat[1].威胁度)}</div>` : empty("文明档案尚未建立")}</article>
      <article class="tb-card">${cardTitle("工程脉冲", "PROJECT PULSE")}<div class="tb-summary">${activeProjects.length} 个项目处于活动窗口</div><div style="margin-top:12px">${chips(activeProjects.slice(0, 3).map(([, item]) => item.名称))}</div></article>
      <article class="tb-card">${cardTitle("技术扩散", "DIFFUSION")}<div class="tb-summary">${exposedTech.length} 项技术达到高扩散阈值</div><div style="margin-top:12px">${chips(exposedTech.slice(0, 3).map(([, item]) => item.名称))}</div></article>
    </div>`;

    $id("tb-panel-civilization").innerHTML = `
      <div class="tb-toolbar">${filters.map(filter => `<button class="tb-filter ${state.domainFilter === filter ? "active" : ""}" type="button" data-action="domain-filter" data-filter="${esc(filter)}">${esc(filter)}</button>`).join("")}</div>
      ${summary}
      ${visible.map(([kind, records]) => `${sectionHead(kind, `${records.length} 份档案`)}<div class="tb-entity-grid">${records.length ? records.map(([uid, item]) => domainCard(kind, uid, item)).join("") : empty(`${kind}档案为空`)}</div>`).join("")}`;
  };

  const causalChain = data => {
    const nodes = asObject(valueAt(data, "因果.节点", {}));
    const main = asArray(valueAt(data, "因果.主链", []));
    if (!main.length) return empty("蝴蝶效应主链尚未形成");
    return `<div class="tb-chain">${main.map(uid => {
      const node = asObject(nodes[uid]);
      return `<article class="tb-chain-node" data-action="open-entity" data-kind="因果节点" data-uid="${esc(uid)}"><div class="tb-chain-type">${esc(node.类型 || "状态变化")}</div><div class="tb-chain-title">${esc(node.标题 || resolveUID(uid))}</div><div class="tb-chain-meta">${esc(node.时间 || "时间未知")} · ${esc(node.传播尺度 || "局部")} · ${esc(node.置信度 || "未知")}</div></article>`;
    }).join("")}</div>`;
  };

  const renderDelayed = records => records.length ? records.map(([uid, item]) => entityButton("延迟效应", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(item.名称 || uid)}</div><div class="tb-entity-id">${esc(uid)} · ${esc(item.预计时间 || "时间未知")}</div></div>${status(item.状态)}</div><div class="tb-entity-body">${esc(compact(asArray(item.预计结果).join("；") || "预计结果未知", 88))}</div><div class="tb-entity-foot">${status(item.置信度)}${asArray(item.来源节点UID).slice(0, 2).map(source => chip(resolveUID(source))).join("")}</div>`)).join("") : empty("没有延迟效应记录");

  const renderProjections = records => records.length ? records.map(([uid, item]) => entityButton("未来影响", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(item.名称 || uid)}</div><div class="tb-entity-id">${esc(uid)} · ${esc(item.时间范围 || "时间范围未知")}</div></div>${status(item.置信度)}</div><div class="tb-entity-body">${esc(compact(asArray(item.可能变化).join("；") || "变化尚未投影", 88))}</div><div class="tb-entity-foot">${chip(`反事实 · ${item.反事实基线 || "未设置"}`)}</div>`)).join("") : empty("没有未来影响投影");

  const renderCausality = data => {
    const causal = asObject(data.因果);
    const worldline = asObject(data.世界线);
    const nodes = entries(causal.节点);
    const edges = entries(causal.边);
    const branches = entries(causal.分支);
    const delayed = entries(causal.延迟效应);
    const projections = entries(causal.未来影响);
    const events = entries(data.原著事件);
    const activeNodes = nodes.filter(([, node]) => ["活跃", "等待传播"].includes(node.状态));
    const blockedEdges = edges.filter(([, edge]) => edge.状态 === "已阻断");
    const changedEvents = events.filter(([, event]) => !["未到达", "可如常发生"].includes(event.当前状态));

    const topology = `<div class="tb-grid-3">
      ${rootCard("世界线", `${cardTitle("世界线分类", "DIVERGENCE")}
        <div class="tb-entity-head"><div class="tb-summary">${esc(worldline.当前世界线 || "原著基线")}</div>${status(worldline.分类)}</div>
        <div style="margin-top:12px">${bar("总体偏移度", worldline.总体偏移度)}</div>
        <div style="margin-top:12px">${chips(asArray(worldline.分歧点UID).map(resolveUID), "尚无分歧点")}</div>`)}
      <article class="tb-card">${cardTitle("传播拓扑", "GRAPH")}${factGrid([["因果节点", nodes.length], ["有效边", edges.length - blockedEdges.length], ["已阻断边", blockedEdges.length], ["活动节点", activeNodes.length], ["分支", branches.length]])}</article>
      <article class="tb-card">${cardTitle("不可逆改变", "NO RETURN")}${list(worldline.不可逆改变, true, "尚无确认的不可逆改变")}</article>
    </div>`;

    const changedEventCards = changedEvents.length ? changedEvents.map(([uid, event]) => entityButton("原著事件", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(event.名称 || uid)}</div><div class="tb-entity-id">${esc(event.原著时间 || "原著时间未知")}</div></div>${status(event.当前状态)}</div><div class="tb-entity-body">${esc(compact(event.当前预计结果 || event.原著结果 || "结果未知", 88))}</div><div class="tb-entity-foot">${status(`置信度 ${numeric(event.置信度) ?? "—"}%`)}${asArray(event.偏移原因).slice(0, 2).map(reason => chip(reason, "danger")).join("")}</div>`)).join("") : empty("原著事件仍与基线相容");

    $id("tb-panel-causality").innerHTML = `
      ${topology}
      ${sectionHead("蝴蝶效应主链", `${asArray(causal.主链).length} 个连续节点`)}
      ${causalChain(data)}
      ${sectionHead("延迟效应", `${delayed.length} 个传播中的后果`)}
      <div class="tb-entity-grid">${renderDelayed(delayed)}</div>
      ${sectionHead("未来影响", `${projections.length} 个反事实投影`)}
      <div class="tb-entity-grid">${renderProjections(projections)}</div>
      ${sectionHead("原著事件偏移", `${changedEvents.length}/${events.length} 个事件发生变形`)}
      <div class="tb-entity-grid">${changedEventCards}</div>`;
  };

  const taskCard = (uid, item) => entityButton("任务", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(item.名称 || uid)}</div><div class="tb-entity-id">${esc(uid)} · ${esc(item.截止时间 || "无截止时间")}</div></div>${status(item.状态)}</div><div class="tb-entity-body">${esc(compact(asArray(item.目标).join("；") || "目标尚未建立", 88))}</div><div style="margin-top:11px">${bar("进度", item.进度)}</div>`);

  const promiseCard = (uid, item) => entityButton("承诺", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(compact(item.内容 || uid, 28))}</div><div class="tb-entity-id">${esc(uid)} · ${esc(item.截止时间 || "无截止时间")}</div></div>${status(item.状态)}</div><div class="tb-entity-body">承诺者：${esc(asArray(item.承诺者).map(refText).join("、") || "未知")}<br>对象：${esc(asArray(item.对象).map(refText).join("、") || "未知")}</div>`);

  const intelCard = (uid, item) => entityButton("情报", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(item.标题 || uid)}</div><div class="tb-entity-id">${esc(uid)} · ${esc(item.保密等级 || "受限")}</div></div>${status(item.真实性)}</div><div class="tb-entity-body">${esc(compact(item.内容摘要 || "内容摘要尚未建立", 88))}</div><div class="tb-entity-foot">${chip(`可信度 ${numeric(item.可信度) ?? "—"}%`)}${status(item.有效状态)}</div>`);

  const commCard = (uid, item) => entityButton("通讯", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(item.标题 || uid)}</div><div class="tb-entity-id">${esc(uid)} · ${esc(item.发送时间 || "发送时间未知")}</div></div>${status(item.状态)}</div><div class="tb-entity-body">${esc(compact(item.内容摘要 || "通讯内容尚未建立", 88))}</div><div class="tb-entity-foot">${chip(`延迟 · ${item.通信延迟 || "未知"}`)}${asArray(item.待决策事项).slice(0, 1).map(value => chip(value, "amber")).join("")}</div>`);

  const memoryCard = (uid, item) => entityButton("记忆摘要", uid, `<div class="tb-entity-head"><div><div class="tb-entity-name">${esc(item.时期 || item.摘要 || uid)}</div><div class="tb-entity-id">${esc(uid)}</div></div>${chip(`重要性 ${numeric(item.重要性) ?? "—"}%`)}</div><div class="tb-entity-body">${esc(compact(item.摘要 || "摘要尚未建立", 100))}</div>`);

  const renderRecords = data => {
    const tasks = entries(data.任务);
    const promises = entries(data.承诺);
    const intel = entries(data.情报);
    const comms = entries(data.通讯);
    const memories = entries(data.记忆摘要);
    const urgentTasks = tasks.filter(([, task]) => ["受阻", "失败"].includes(task.状态));
    const intercepted = comms.filter(([, comm]) => ["被截获", "丢失", "延迟"].includes(comm.状态));
    const falseIntel = intel.filter(([, item]) => ["虚假", "误导"].includes(item.真实性));

    $id("tb-panel-records").innerHTML = `
      <div class="tb-grid-3">
        <article class="tb-card">${cardTitle("任务异常", "TASK ALERT")}<div class="tb-summary">${urgentTasks.length} 个任务需要注意</div><div style="margin-top:11px">${chips(urgentTasks.map(([, item]) => item.名称), "没有受阻任务")}</div></article>
        <article class="tb-card">${cardTitle("通讯异常", "COMM NOISE")}<div class="tb-summary">${intercepted.length} 条通讯存在截获、丢失或延迟</div><div style="margin-top:11px">${chips(intercepted.map(([, item]) => item.标题), "链路正常")}</div></article>
        <article class="tb-card">${cardTitle("认知污染", "FALSE SIGNAL")}<div class="tb-summary">${falseIntel.length} 条情报被标记为虚假或误导</div><div style="margin-top:11px">${chips(falseIntel.map(([, item]) => item.标题), "未发现已知污染")}</div></article>
      </div>
      ${sectionHead("任务", `${tasks.length} 项`)}<div class="tb-entity-grid">${tasks.length ? tasks.map(([uid, item]) => taskCard(uid, item)).join("") : empty("任务档案为空")}</div>
      ${sectionHead("承诺", `${promises.length} 项`)}<div class="tb-entity-grid">${promises.length ? promises.map(([uid, item]) => promiseCard(uid, item)).join("") : empty("承诺档案为空")}</div>
      ${sectionHead("情报", `${intel.length} 份`)}<div class="tb-entity-grid">${intel.length ? intel.map(([uid, item]) => intelCard(uid, item)).join("") : empty("情报档案为空")}</div>
      ${sectionHead("通讯", `${comms.length} 条`)}<div class="tb-entity-grid">${comms.length ? comms.map(([uid, item]) => commCard(uid, item)).join("") : empty("通讯档案为空")}</div>
      ${sectionHead("记忆摘要", `${memories.length} 个时期`)}<div class="tb-entity-grid">${memories.length ? memories.map(([uid, item]) => memoryCard(uid, item)).join("") : empty("记忆摘要为空")}</div>`;
  };

  const scalarDetail = (key, value) => {
    const resolved = resolveUIDs(safeDisplay(value));
    const percentLike = typeof value === "number" && value >= 0 && value <= 100 && /度|力|感|进度|压力|恐惧|希望|意志|关注|影响|信任|好感|戒备|依赖|成熟|可控|扩散|重要|置信/.test(key);
    return `<div class="tb-detail-row"><div class="tb-detail-key">${esc(key)}</div><div class="tb-detail-value">${percentLike ? bar("", value) : esc(resolved)}</div></div>`;
  };

  const detailObject = (object, depth = 0) => entries(object).filter(([key]) => !key.startsWith("_")).map(([key, value]) => {
    if (Array.isArray(value)) {
      if (!value.length) return scalarDetail(key, "无");
      if (value.some(item => item && typeof item === "object")) {
        return `<details class="tb-detail-group" ${depth < 1 ? "open" : ""}><summary>${esc(key)} · ${value.length}</summary><div class="tb-detail-content">${value.map((item, index) => item && typeof item === "object" ? `<details class="tb-detail-group"><summary>记录 ${index + 1}</summary><div class="tb-detail-content">${detailObject(item, depth + 1)}</div></details>` : scalarDetail(String(index + 1), item)).join("")}</div></details>`;
      }
      return scalarDetail(key, value.map(item => resolveUIDs(safeDisplay(item))).join("、"));
    }
    if (value && typeof value === "object") {
      const content = detailObject(value, depth + 1);
      return `<details class="tb-detail-group" ${depth < 1 ? "open" : ""}><summary>${esc(key)}</summary><div class="tb-detail-content">${content || scalarDetail("记录", "无")}</div></details>`;
    }
    return scalarDetail(key, value);
  }).join("");

  const relationSummary = (data, uid) => {
    const records = TB.relatedRelations(data, uid);
    if (!records.length) return "";
    return `${sectionHead("关系网络", `${records.length} 条双向关系`)}${records.map(([relationUid, relation]) => {
      const a = asObject(relation.A);
      const b = asObject(relation.B);
      const aName = a.名称 || resolveUID(a.UID);
      const bName = b.名称 || resolveUID(b.UID);
      return `<div class="tb-relation-strip" data-action="open-entity" data-kind="关系" data-uid="${esc(relationUid)}" style="cursor:pointer"><div class="tb-relation-side"><div class="tb-entity-name">${esc(aName)}</div><div class="tb-count">${esc(relation.A对B?.真实态度 || relation.公开关系 || "态度未知")}</div></div><div class="tb-relation-arrow">⟶ ${esc(relation.真实关系 || relation.公开关系 || "关联")} ⟵</div><div class="tb-relation-side"><div class="tb-entity-name">${esc(bName)}</div><div class="tb-count">${esc(relation.B对A?.真实态度 || relation.公开关系 || "态度未知")}</div></div></div>`;
    }).join("")}`;
  };

  const openModal = (kind, uid, object) => {
    const modal = $id("tb-modal");
    const title = kind === "主角" ? valueAt(object, "身份.姓名", "主角档案") : entityName(kind, uid, object);
    $id("tb-modal-code").textContent = `${kind.toUpperCase()} / ${uid}`;
    $id("tb-modal-title").textContent = title;
    const relations = kind === "人物" ? relationSummary(state.data, uid) : "";
    $id("tb-modal-body").innerHTML = `${relations}${sectionHead("完整变量映射", "只读视图")}${detailObject(object) || empty("该档案暂无可显示字段")}`;
    modal.classList.add("active");
    modal.setAttribute("aria-hidden", "false");
    $id("tb-modal-body").scrollTop = 0;
  };

  const closeModal = () => {
    const modal = $id("tb-modal");
    modal.classList.remove("active");
    modal.setAttribute("aria-hidden", "true");
  };

  const openEntity = (kind, uid) => {
    const record = state.entityIndex.get(`${kind}:${uid}`);
    if (record) openModal(record.kind, record.uid, record.value);
  };

  const openRoot = root => {
    const record = state.entityIndex.get(`ROOT:${root}`);
    if (record) openModal(record.kind, record.uid, record.value);
  };

  TB.renderCivilization = renderCivilization;
  TB.renderCausality = renderCausality;
  TB.renderRecords = renderRecords;
  TB.openEntity = openEntity;
  TB.openRoot = openRoot;
  TB.closeModal = closeModal;
})(window.ThreeBodyStatusbar);

    if (persist) {
      getThemeStores().forEach(store => {
        try { store.setItem(THEME_STORAGE_KEY, next); } catch {}
      });
    }
  };

  const showFailure = message => {
    const panel = $id(`tb-panel-${state.tab}`) || $id("tb-panel-observation");
    panel.innerHTML = `<div class="tb-empty tb-error">${esc(message)}</div>`;
    $id("tb-source").textContent = "MVU SIGNAL · UNAVAILABLE";
    $id("tb-footer-status").textContent = "未读取到 stat_data · 可在地址末尾添加 ?preview=1 检查界面";
  };

  const renderAll = data => {
    state.data = data;
    rebuildIndexes(data);
    updateHeader(data);
    TB.renderObservation(data);
    TB.renderProtagonist(data);
    TB.renderPeople(data);
    TB.renderCivilization(data);
    TB.renderCausality(data);
    TB.renderRecords(data);
    updateFooter(data);
  };

  const readWithRetry = async () => {
    for (let attempt = 0; attempt < 12; attempt += 1) {
      const data = await TB.readGameData();
      if (data && Object.keys(data).length) return data;
      await new Promise(resolve => setTimeout(resolve, 180));
    }
    return null;
  };

  const refresh = async () => {
    if (state.refreshing) return;
    state.refreshing = true;
    $id("tb-footer-status").textContent = "正在重新采样 MVU 信号";
    try {
      const data = await readWithRetry();
      if (!data) {
        showFailure("未能读取 MVU 变量。请确认当前楼层或聊天变量中存在 stat_data，并已启用酒馆助手与 MVU。\n预览界面可在状态栏地址末尾添加 ?preview=1。");
        return;
      }
      renderAll(data);
    } catch (error) {
      showFailure(`状态栏渲染失败：${error?.message || "未知错误"}`);
    } finally {
      state.refreshing = false;
    }
  };

  const setTab = tab => {
    if (!$id(`tb-panel-${tab}`)) return;
    state.tab = tab;
    document.querySelectorAll(".tb-tab").forEach(button => button.classList.toggle("active", button.dataset.tab === tab));
    document.querySelectorAll(".tb-panel").forEach(panel => panel.classList.toggle("active", panel.id === `tb-panel-${tab}`));
    TB.closeModal();
  };

  const handleClick = event => {
    const tab = event.target.closest("[data-tab]");
    if (tab) {
      setTab(tab.dataset.tab);
      return;
    }
    const target = event.target.closest("[data-action]");
    if (!target) return;
    const action = target.dataset.action;
    if (action === "set-theme") {
      applyTheme(target.dataset.themeChoice, true);
      return;
    }
    if (action === "refresh") refresh();
    if (action === "close-modal") TB.closeModal();
    if (action === "open-entity") TB.openEntity(target.dataset.kind, target.dataset.uid);
    if (action === "open-root") TB.openRoot(target.dataset.root);
    if (action === "npc-filter") {
      state.npcFilter = target.dataset.filter || "全部";
      TB.renderPeople(state.data);
    }
    if (action === "domain-filter") {
      state.domainFilter = target.dataset.filter || "全部";
      TB.renderCivilization(state.data);
    }
  };

  const debounce = (fn, delay) => {
    let timer;
    return (...args) => {
      clearTimeout(timer);
      timer = setTimeout(() => fn(...args), delay);
    };
  };

  const bindTavernEvents = () => {
    if (typeof globalThis.eventOn !== "function" || !globalThis.tavern_events) return;
    const updated = debounce(refresh, 300);
    const received = () => {
      const timer = setTimeout(refresh, 1000);
      state.timers.push(timer);
    };
    const eventPairs = [
      [globalThis.tavern_events.MESSAGE_UPDATED, updated],
      [globalThis.tavern_events.MESSAGE_EDITED, updated],
      [globalThis.tavern_events.MESSAGE_SWIPED, updated],
      [globalThis.tavern_events.MESSAGE_RECEIVED, received],
      [globalThis.tavern_events.CHAT_CHANGED, () => location.reload()],
    ].filter(([eventName]) => eventName);
    eventPairs.forEach(([eventName, handler]) => {
      try {
        const subscription = globalThis.eventOn(eventName, handler);
        if (subscription?.stop) state.cleanup.push(() => subscription.stop());
      } catch {}
    });
  };

  const destroy = () => {
    state.cleanup.splice(0).forEach(stop => {
      try { stop(); } catch {}
    });
    state.timers.splice(0).forEach(timer => clearTimeout(timer));
    clearTimeout(state.npcSearchTimer);
  };

  const init = async () => {
    applyTheme(readTheme());
    const frame = $id("tb-frame");
    frame.addEventListener("click", handleClick);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") TB.closeModal();
    });
    bindTavernEvents();
    if (typeof globalThis.$ === "function") globalThis.$(window).on("pagehide", destroy);
    else window.addEventListener("pagehide", destroy, { once: true });
    await refresh();
  };

  const launch = () => {
    try {
      if (typeof globalThis.errorCatched === "function") globalThis.errorCatched(init)();
      else Promise.resolve(init()).catch(error => showFailure(error?.message || "初始化失败"));
    } catch (error) {
      showFailure(error?.message || "初始化失败");
    }
  };

  TB.refresh = refresh;
  if (typeof globalThis.$ === "function") globalThis.$(() => launch());
  else setTimeout(launch, 0);
})(window.ThreeBodyStatusbar);

  </script>
</body>
</html>
