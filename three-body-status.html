    ["people", "人物关系"],
    ["civilization", "组织文明"],
    ["technology", "科技资产"],
    ["events", "事件时间线"],
    ["causality", "因果网络"],
    ["comms", "通讯任务"],
    ["archive", "归档检索"]
  ]);
  function card(document2, title, value) {
    return el(document2, "section", { className: "tb-mvu-card", children: [
      el(document2, "h3", { text: title }),
      el(document2, "p", { text: valueText(value) })
    ] });
  }
  function searchableText(key, value) {
    try {
      return `${key}${JSON.stringify(value)}`.toLowerCase();
    } catch {
      return String(key).toLowerCase();
    }
  }
  function lifecycleOf(value) {
    return value?.状态?.生命周期 ?? value?.生命周期 ?? "活跃";
  }
  function recordGrid(document2, title, record, ui) {
    const normalized = String(ui.query ?? "").trim().toLowerCase();
    const lifecycleFilter = ui.lifecycleFilter ?? "全部";
    const rows = entries(record).filter(([key, value]) => {
      const queryMatches = !normalized || searchableText(key, value).includes(normalized);
      const lifecycleMatches = lifecycleFilter === "全部" || lifecycleOf(value) === lifecycleFilter;
      return queryMatches && lifecycleMatches;
    });
    const pageSize = 12;
    const pageCount = Math.max(1, Math.ceil(rows.length / pageSize));
    const requestedPage = Number.isInteger(ui.archivePage) ? ui.archivePage : 1;
    const page = Math.max(1, Math.min(requestedPage, pageCount));
    const visible = rows.slice((page - 1) * pageSize, page * pageSize);
    const section = el(document2, "section", {
      className: "tb-mvu-record-section",
      children: [el(document2, "h2", { text: title })]
    });
    if (!visible.length) {
      section.append(el(document2, "p", { className: "tb-mvu-empty", text: "暂无记录" }));
    } else {
      section.append(el(document2, "div", {
        className: "tb-mvu-card-grid",
        children: visible.map(([key, value]) => card(document2, key, value))
      }));
    }
    section.append(el(document2, "footer", { className: "tb-mvu-pager", children: [
      el(document2, "button", { text: "上一页", attrs: { type: "button", "data-action": "page-prev", disabled: page <= 1 } }),
      el(document2, "span", { text: `${page} / ${pageCount}` }),
      el(document2, "button", { text: "下一页", attrs: { type: "button", "data-action": "page-next", disabled: page >= pageCount } })
    ] }));
    return section;
  }
  function renderPanel(document2, panel, data = {}, ui = {}) {
    if (panel === "overview") return el(document2, "div", { className: "tb-mvu-overview", children: [
      card(document2, "当前观测", `${valueText(data.时空?.公元时间)} · ${valueText(data.时空?.当前地点)}`),
      card(document2, "场景", data.场景?.标题),
      card(document2, "世界线", data.世界线?.分类),
      ...data.$系统 ? [
        card(document2, "秘密观察者", data.场景?.秘密观察者),
        card(document2, "未来投影", data.世界线?.未来投影),
        card(document2, "完整性诊断", data.$系统?.完整性状态)
      ] : [],
      renderCausalLightCone(document2, data.因果, ui.causalScale)
    ] });
    if (panel === "protagonist") return recordGrid(document2, "主角与记忆", { 主角: data.主角, 任务与记忆: data.任务与记忆 }, ui);
    if (panel === "people") return recordGrid(document2, "人物与方向关系", { ...data.人物 ?? {}, ...data.关系 ?? {} }, ui);
    if (panel === "civilization") return recordGrid(document2, "组织与文明", { ...data.组织 ?? {}, ...data.文明 ?? {} }, ui);
    if (panel === "technology") return recordGrid(document2, "科技与资产", { ...data.科技 ?? {}, ...data.资产 ?? {} }, ui);
    if (panel === "events") return recordGrid(document2, "事件时间线", data.事件, ui);
    if (panel === "causality") return renderCausalLightCone(document2, data.因果, ui.causalScale);
    if (panel === "comms") return recordGrid(document2, "通讯、任务与诊断", { ...data.通讯 ?? {}, ...data.任务与记忆?.任务 ?? {}, ...data.$系统?.错误诊断 ?? {} }, ui);
    const archive = data.$系统?.索引?.归档 ?? [];
    const archiveRecord = Array.isArray(archive) ? Object.fromEntries(archive.map((path) => [path, { 生命周期: "归档" }])) : archive;
    return recordGrid(document2, "休眠与归档索引", archiveRecord, ui);
  }

  // src/ui/app.js
  function mountThreeBodyStatus(root, adapters = {}) {
    if (!root?.ownerDocument) throw new TypeError("STATUS_ROOT_REQUIRED");
    if (typeof root.__tbMvuCleanup === "function") root.__tbMvuCleanup();
    const document2 = root.ownerDocument;
    const messageId = Number(root.dataset.messageId ?? -1);
    const read = adapters.read ?? (() => readMessageStatData(messageId));
    const subscribe = adapters.subscribe ?? ((listener) => subscribeToVariableUpdates(listener));
    const store = createUiStore();
    let source = read();
    let destroyed = false;
    function render() {
      if (destroyed) return;
      const ui = store.get();
      const panel = PANELS.some(([id]) => id === ui.panel) ? ui.panel : "overview";
      const data = ui.observerEnabled ? projectObserverView(source) : projectFiniteView(source);
      let panelContent;
      try {
        panelContent = renderPanel(document2, panel, data, ui);
      } catch (error) {
        panelContent = el(document2, "section", { className: "tb-mvu-panel-error", children: [
          el(document2, "h2", { text: "此观测区暂时无法解析" }),
          el(document2, "p", { text: String(error?.message ?? error) })
        ] });
      }
      clear(root);
      root.className = `tb-mvu-shell${ui.observerEnabled ? " tb-mvu-shell--observer" : ""}`;
      root.append(el(document2, "header", { className: "tb-mvu-observation-strip", children: [
        el(document2, "div", { className: "tb-mvu-orbit-mark", attrs: { "aria-hidden": "true" } }),
        el(document2, "div", { children: [
          el(document2, "p", { className: "tb-mvu-kicker", text: data.时空?.主纪元 || "未定纪元" }),
          el(document2, "h1", { text: data.场景?.标题 || "开局坐标待初始化" }),
          el(document2, "p", { className: "tb-mvu-coordinate", text: `${data.时空?.公元时间 || "时间未知"} · ${data.时空?.当前地点 || "地点未知"} · ${data.时空?.时间可信精度 || "精度未知"}` })
        ] }),
        el(document2, "button", {
          className: "tb-mvu-observer-button",
          text: ui.observerEnabled ? "关闭观测者权限" : "观测者权限",
          attrs: { type: "button", "data-action": "observer", "aria-pressed": ui.observerEnabled }
        })
      ] }));
      const lifecycleSelect = el(document2, "select", {
        attrs: { "data-control": "lifecycle", "aria-label": "生命周期层级" },
        children: ["全部", "活跃", "休眠", "归档"].map((value) => el(document2, "option", { text: value, attrs: { value } }))
      });
      lifecycleSelect.value = ui.lifecycleFilter;
      root.append(el(document2, "div", { className: "tb-mvu-toolbar", children: [
        el(document2, "label", { children: [
          el(document2, "span", { text: "检索" }),
          el(document2, "input", { attrs: { type: "search", value: ui.query, placeholder: "人物、事件、因果…", "data-control": "query" } })
        ] }),
        el(document2, "label", { children: [el(document2, "span", { text: "层级" }), lifecycleSelect] }),
        el(document2, "button", { text: ui.pinned.includes(panel) ? "取消钉住" : "钉住面板", attrs: { type: "button", "data-action": "pin" } }),
        el(document2, "button", { text: "缩小因果图", attrs: { type: "button", "data-action": "zoom-out" } }),
        el(document2, "button", { text: "放大因果图", attrs: { type: "button", "data-action": "zoom-in" } }),
        el(document2, "button", { text: ui.collapsed ? "展开状态栏" : "折叠状态栏", attrs: { type: "button", "data-action": "collapse", "aria-expanded": !ui.collapsed } })
      ] }));
      if (!ui.collapsed) root.append(el(document2, "div", { className: "tb-mvu-workspace", children: [
        el(document2, "nav", {
          className: "tb-mvu-nav",
          attrs: { "aria-label": "状态栏领域" },
          children: PANELS.map(([id, label]) => el(document2, "button", {
            className: id === panel ? "is-active" : "",
            text: `${label}${ui.pinned.includes(id) ? " ·" : ""}`,
            attrs: { type: "button", "data-panel": id, "aria-current": id === panel ? "page" : null }
          }))
        }),
        el(document2, "main", { className: "tb-mvu-stage", children: [
          el(document2, "div", { attrs: { "data-panel-rendered": panel }, children: [panelContent] })
        ] })
      ] }));
      if (ui.observerWarningOpen) root.append(el(document2, "div", { className: "tb-mvu-dialog-backdrop", children: [
        el(document2, "section", { className: "tb-mvu-dialog", attrs: { role: "dialog", "aria-modal": "true", "aria-labelledby": "tb-mvu-warning-title" }, children: [
          el(document2, "h2", { text: "观测会改变阅读边界", attrs: { id: "tb-mvu-warning-title" } }),
          el(document2, "p", { text: "将显示 NPC 秘密、完整蝴蝶效应、未来因果链和系统诊断。此选择只在本次状态栏中有效。" }),
          el(document2, "button", { text: "确认进入观测者层", attrs: { type: "button", "data-action": "confirm-observer" } }),
          el(document2, "button", { text: "保持有限视角", attrs: { type: "button", "data-action": "cancel-observer" } })
        ] })
      ] }));
    }
    const onClick = (event) => {
      const button = event.target instanceof document2.defaultView.Element ? event.target.closest("button") : null;
      const action = button?.dataset;
      if (!action) return;
      if (action.panel && PANELS.some(([id]) => id === action.panel)) store.set({ panel: action.panel, archivePage: 1 });
      if (action.action === "observer") {
        if (store.get().observerEnabled) store.set({ observerEnabled: false, observerWarningOpen: false });
        else store.set({ observerWarningOpen: true });
      }
      if (action.action === "confirm-observer") store.set({ observerEnabled: true, observerWarningOpen: false });
      if (action.action === "cancel-observer") store.set({ observerWarningOpen: false });
      if (action.action === "pin") {
        const { panel, pinned } = store.get();
        const safePanel = PANELS.some(([id]) => id === panel) ? panel : "overview";
        store.set({ pinned: pinned.includes(safePanel) ? pinned.filter((id) => id !== safePanel) : [...pinned, safePanel] });
      }
      if (action.action === "zoom-in") store.set({ causalScale: Math.min(2, Number((store.get().causalScale + 0.15).toFixed(2))) });
      if (action.action === "zoom-out") store.set({ causalScale: Math.max(0.55, Number((store.get().causalScale - 0.15).toFixed(2))) });
      if (action.action === "page-prev") store.set({ archivePage: Math.max(1, store.get().archivePage - 1) });
      if (action.action === "page-next") store.set({ archivePage: store.get().archivePage + 1 });
      if (action.action === "collapse") store.set({ collapsed: !store.get().collapsed });
    };
    const onInput = (event) => {
      if (event.target?.dataset?.control === "query") store.set({ query: event.target.value, archivePage: 1 });
    };
    const onChange = (event) => {
      if (event.target?.dataset?.control === "lifecycle") store.set({ lifecycleFilter: event.target.value, archivePage: 1 });
    };
    root.addEventListener("click", onClick);
    root.addEventListener("input", onInput);
    root.addEventListener("change", onChange);
    const unsubscribeStore = store.subscribe(render);
    const mvuCleanup = subscribe(() => {
      source = read();
      render();
    });
    const unsubscribeMvu = typeof mvuCleanup === "function" ? mvuCleanup : () => {
    };
    render();
    const destroy = () => {
      if (destroyed) return;
      destroyed = true;
      unsubscribeMvu();
      unsubscribeStore();
      root.removeEventListener("click", onClick);
      root.removeEventListener("input", onInput);
      root.removeEventListener("change", onChange);
      clear(root);
      if (root.__tbMvuCleanup === destroy) delete root.__tbMvuCleanup;
    };
    root.__tbMvuCleanup = destroy;
    return { destroy, store };
  }

  // src/ui/entry.js
  for (const root of document.querySelectorAll("[data-tb-mvu-app]:not([data-tb-mvu-ready])")) {
    root.setAttribute("data-tb-mvu-ready", "true");
    mountThreeBodyStatus(root);
  }
})();
</script>
